services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: enterprise-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password

    ports:
      - "5432:5432"

    volumes:
      - enterprise_ai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d enterprise_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  enterprise_ai_postgres_data: